  const pending = {};

    const { id, result } = e.data;
    if (pending[id]) {
      pending[id](result);
      delete pending[id];
    }
  });

  window.devidb.get = function(key) {
    return new Promise(resolve => {

      let type = "get";
      let val = null;

    });
  };
  window.devidb.set = function(key, val) {
    return new Promise(resolve => {
      const id = nextId++;
      pending[id] = resolve;
      let type = "set";
      parent.postMessage({ id, type, key, val }, "*");
    });
  };
